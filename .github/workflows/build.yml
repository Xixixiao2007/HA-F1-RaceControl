name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # build-tools 30.0.3 的 d8 只需要 JDK 8，所以整条链路用 8 就够。
      #
      # 这里刻意**不用** android-actions/setup-android：
      # 它拉取的 cmdline-tools 需要 JDK 11+ 才能运行 sdkmanager，
      # 会和本项目的 JDK 8 冲突，导致 "Set up Android SDK" 步骤失败。
      # 改用项目自带的 tools/fetch_sdk.py —— 和本地构建走完全同一条路径。
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Android toolchain
        uses: actions/cache@v4
        with:
          path: tools/_dl_cache
          key: android-sdk-${{ runner.os }}-${{ hashFiles('tools/fetch_sdk.py') }}

      - name: Download Android toolchain (~120 MB)
        run: python3 tools/fetch_sdk.py

      - name: Run unit tests
        run: python3 tools/run_tests.py

      - name: Build APK
        run: python3 tools/build_apk.py --out HA-F1-RaceControl.apk
        env:
          # runner 镜像预装了 Android SDK 并设了 ANDROID_SDK_ROOT，
          # 但里面没有 build-tools 30.0.3。这里显式指到刚下载的那一份，
          # 免得被环境变量带偏（build_apk.py 自己也已优先选版本匹配的 SDK）。
          HAF1_SDK: ${{ github.workspace }}/tools/android-sdk

      - name: Show APK info
        run: ls -l HA-F1-RaceControl.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HA-F1-RaceControl-apk
          path: HA-F1-RaceControl.apk
          if-no-files-found: error
